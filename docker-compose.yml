name: dataplatformbi

services:
  # Simulated OLTP source database ("Databases" in the architecture).
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SRC_PG_DB:?set SRC_PG_DB in .env}
      POSTGRES_USER: ${SRC_PG_ADMIN_USER:?set SRC_PG_ADMIN_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      AIRBYTE_PG_USER: ${AIRBYTE_PG_USER:?set AIRBYTE_PG_USER in .env}
    secrets: [pg_admin_password, airbyte_pg_password]
    # timezone stays UTC on purpose; log_timezone only changes the log timestamps.
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=${TIMEZONE:?set TIMEZONE in .env}"]
    ports:
      - "${SRC_PG_PORT:-5433}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/seed:/seed:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  # Warehouse: Airbyte loads raw data here.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    # The default user's password is read from its secret file, then the stock entrypoint runs.
    entrypoint: ["/bin/bash", "-c", "export CLICKHOUSE_PASSWORD=$$(cat /run/secrets/clickhouse_admin_password) && exec /entrypoint.sh"]
    secrets:
      - clickhouse_admin_password
      - clickhouse_airbyte_password
      - clickhouse_loader_password
      - clickhouse_dbt_password
      - seaweedfs_clickhouse_access_key
      - seaweedfs_clickhouse_secret_key
    environment:
      TIMEZONE: ${TIMEZONE:?set TIMEZONE in .env}

      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

      CLICKHOUSE_AIRBYTE_USER: ${CLICKHOUSE_AIRBYTE_USER:?set CLICKHOUSE_AIRBYTE_USER in .env}
      # Used by clickhouse/init/loader_user_clickhouse.sh (loads Parquet from SeaweedFS)
      CLICKHOUSE_LOADER_USER: ${CLICKHOUSE_LOADER_USER:?set CLICKHOUSE_LOADER_USER in .env}
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-landing}
      # Used by clickhouse/init/dbt_user_clickhouse.sh
      CLICKHOUSE_DBT_USER: ${CLICKHOUSE_DBT_USER:?set CLICKHOUSE_DBT_USER in .env}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     # HTTP: Airbyte, DBeaver
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"   # native protocol: clickhouse-client
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/sql:/sql:ro
      - ./clickhouse/config.d/timezone.xml:/etc/clickhouse-server/config.d/timezone.xml:ro
      - ./clickhouse/users.d/named_collections.xml:/etc/clickhouse-server/users.d/named_collections.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 3g

  # Object storage with an S3 API: raw Parquet files and documents.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:?set TIMEZONE in .env}
      WEED_ADMIN_USER: ${SEAWEEDFS_UI_USER:?set SEAWEEDFS_UI_USER in .env}
    secrets:
      - seaweedfs_ui_password
      - seaweedfs_admin_access_key
      - seaweedfs_admin_secret_key
      - seaweedfs_airbyte_access_key
      - seaweedfs_airbyte_secret_key
      - seaweedfs_clickhouse_access_key
      - seaweedfs_clickhouse_secret_key
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        s=/run/secrets
        export WEED_ADMIN_PASSWORD=$$(cat $$s/seaweedfs_ui_password)
        cat > /tmp/s3.json <<EOF
        {"identities": [
          {"name": "admin",
           "credentials": [{"accessKey": "$$(cat $$s/seaweedfs_admin_access_key)",
                            "secretKey": "$$(cat $$s/seaweedfs_admin_secret_key)"}],
           "actions": ["Admin", "Read", "Write", "List", "Tagging"]},
          {"name": "airbyte",
           "credentials": [{"accessKey": "$$(cat $$s/seaweedfs_airbyte_access_key)",
                            "secretKey": "$$(cat $$s/seaweedfs_airbyte_secret_key)"}],
           "actions": ["Read:${SEAWEEDFS_BUCKET:-landing}",
                      "Write:${SEAWEEDFS_BUCKET:-landing}",
                      "List:${SEAWEEDFS_BUCKET:-landing}"]},
          {"name": "clickhouse",
           "credentials": [{"accessKey": "$$(cat $$s/seaweedfs_clickhouse_access_key)",
                            "secretKey": "$$(cat $$s/seaweedfs_clickhouse_secret_key)"}],
           "actions": ["Read:${SEAWEEDFS_BUCKET:-landing}", "List:${SEAWEEDFS_BUCKET:-landing}"]}
        ]}
        EOF
        exec weed mini -dir=/data -s3.config=/tmp/s3.json -bucket=${SEAWEEDFS_BUCKET:-landing} -admin.port=12646
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"   # S3 API
      - "127.0.0.1:12646:12646"   # Admin UI (login required), localhost only
    volumes:
      - seaweedfs-data:/data
      # The image has no tzdata: ship the zone file so TZ works. Replace it if TIMEZONE changes.
      - ./seaweedfs/zoneinfo/Asia/Bangkok:/usr/share/zoneinfo/Asia/Bangkok:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g

  # run with: docker compose run --rm dbt <command>
  dbt:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /dbt
    entrypoint: ["sh", "/dbt/entrypoint.sh"]
    environment:
      DBT_PROFILES_DIR: /dbt
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      TIMEZONE: ${TIMEZONE:?set TIMEZONE in .env}
      CLICKHOUSE_DBT_USER: ${CLICKHOUSE_DBT_USER:?set CLICKHOUSE_DBT_USER in .env}
    secrets: [clickhouse_dbt_password]
    volumes:
      - ./dbt:/dbt
      - dbt-venv:/opt/venv
    depends_on:
      clickhouse:
        condition: service_healthy

  # Orchestrator: run history in dagster-postgres, UI on :3000, daemon runs schedules.
  dagster-postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: dagster
      POSTGRES_USER: ${DAGSTER_PG_USER:?set DAGSTER_PG_USER in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/dagster_pg_password
    secrets: [dagster_pg_password]
    ports:
      - "127.0.0.1:${DAGSTER_PG_PORT:-5434}:5432"   # for DBeaver, localhost only
    volumes:
      - dagster-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m

  dagster-webserver:
    image: python:3.12-slim
    restart: unless-stopped
    entrypoint: ["sh", "/opt/dagster/entrypoint.sh", "webserver"]
    environment:
      DAGSTER_HOME: /opt/dagster
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:?set DAGSTER_PG_USER in .env}
      AIRBYTE_WORKSPACE_ID: ${AIRBYTE_WORKSPACE_ID:?set AIRBYTE_WORKSPACE_ID in .env}
      AIRBYTE_CONNECTION_ID: ${AIRBYTE_CONNECTION_ID:?set AIRBYTE_CONNECTION_ID in .env}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_LOADER_USER: ${CLICKHOUSE_LOADER_USER:?set CLICKHOUSE_LOADER_USER in .env}
      DBT_PROFILES_DIR: /dbt
      CLICKHOUSE_DBT_USER: ${CLICKHOUSE_DBT_USER:?set CLICKHOUSE_DBT_USER in .env}
      TIMEZONE: ${TIMEZONE:?set TIMEZONE in .env}
      TZ: ${TIMEZONE:?set TIMEZONE in .env}
    secrets: [dagster_pg_password, airbyte_client_id, airbyte_client_secret, clickhouse_loader_password, clickhouse_dbt_password]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Airbyte (abctl) on the host; needed on Linux
    ports:
      - "127.0.0.1:3000:3000"   # no login in Dagster OSS: localhost only
    volumes:
      - ./dagster:/opt/dagster
      - ./clickhouse/sql:/sql:ro   # SQL files run by the load assets
      - ./dbt:/dbt                 # dbt project run by the dbt assets
      - dagster-venv:/opt/venv
    depends_on:
      dagster-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s   # first start installs the venv
    mem_limit: 1g

  dagster-daemon:
    image: python:3.12-slim
    restart: unless-stopped
    entrypoint: ["sh", "/opt/dagster/entrypoint.sh", "daemon"]
    environment:
      DAGSTER_HOME: /opt/dagster
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:?set DAGSTER_PG_USER in .env}
      AIRBYTE_WORKSPACE_ID: ${AIRBYTE_WORKSPACE_ID:?set AIRBYTE_WORKSPACE_ID in .env}
      AIRBYTE_CONNECTION_ID: ${AIRBYTE_CONNECTION_ID:?set AIRBYTE_CONNECTION_ID in .env}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_LOADER_USER: ${CLICKHOUSE_LOADER_USER:?set CLICKHOUSE_LOADER_USER in .env}
      DBT_PROFILES_DIR: /dbt
      CLICKHOUSE_DBT_USER: ${CLICKHOUSE_DBT_USER:?set CLICKHOUSE_DBT_USER in .env}
      TIMEZONE: ${TIMEZONE:?set TIMEZONE in .env}
      TZ: ${TIMEZONE:?set TIMEZONE in .env}
    secrets: [dagster_pg_password, airbyte_client_id, airbyte_client_secret, clickhouse_loader_password, clickhouse_dbt_password]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dagster:/opt/dagster
      - ./clickhouse/sql:/sql:ro   # SQL files run by the load assets
      - ./dbt:/dbt                 # dbt project run by the dbt assets
      - dagster-venv:/opt/venv
    depends_on:
      dagster-webserver:
        condition: service_healthy   # webserver builds the shared venv first
    mem_limit: 1g

# Created by scripts/gen_secrets.sh; compose fails if a file is missing.
secrets:
  # Copy these two from `abctl local credentials` (not generated).
  airbyte_client_id:
    file: ./secrets/airbyte_client_id
  airbyte_client_secret:
    file: ./secrets/airbyte_client_secret
  dagster_pg_password:
    file: ./secrets/dagster_pg_password
  pg_admin_password:
    file: ./secrets/pg_admin_password
  airbyte_pg_password:
    file: ./secrets/airbyte_pg_password
  clickhouse_admin_password:
    file: ./secrets/clickhouse_admin_password
  clickhouse_airbyte_password:
    file: ./secrets/clickhouse_airbyte_password
  clickhouse_loader_password:
    file: ./secrets/clickhouse_loader_password
  clickhouse_dbt_password:
    file: ./secrets/clickhouse_dbt_password
  seaweedfs_ui_password:
    file: ./secrets/seaweedfs_ui_password
  seaweedfs_admin_access_key:
    file: ./secrets/seaweedfs_admin_access_key
  seaweedfs_admin_secret_key:
    file: ./secrets/seaweedfs_admin_secret_key
  seaweedfs_airbyte_access_key:
    file: ./secrets/seaweedfs_airbyte_access_key
  seaweedfs_airbyte_secret_key:
    file: ./secrets/seaweedfs_airbyte_secret_key
  seaweedfs_clickhouse_access_key:
    file: ./secrets/seaweedfs_clickhouse_access_key
  seaweedfs_clickhouse_secret_key:
    file: ./secrets/seaweedfs_clickhouse_secret_key

volumes:
  postgres-data:
  clickhouse-data:
  seaweedfs-data:
  dbt-venv:
  dagster-pg-data:
  dagster-venv:
