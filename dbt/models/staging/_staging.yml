version: 2
# Tests live on staging so a bad value stops dbt before the marts are built!!!!!
models:
  - name: stg_pg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null]

  - name: stg_pg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_pg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pg_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pg_products')
                field: product_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, paid, shipped, delivered, cancelled, refunded]
